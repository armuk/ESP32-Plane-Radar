# Build firmware on push/PR; upload binaries as a short-lived artifact.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-26.04  # pinned like the toolchain; bump deliberately
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"  # pioarduino 55.03.x needs Core >= 6.2.0

      - name: Unit tests (host)
        run: pio test -e native

      - name: Static analysis
        run: pio check -e supermini --fail-on-defect=low

      - name: Build
        run: pio run -e supermini

      - name: Merge web-flash image
        run: pio run -t merge -e supermini

      # Branch and PR builds are not signed (see release.yml), so devices
      # refuse them over the air; flash them over USB to test.
      - name: Software bill of materials
        run: python scripts/make_sbom.py --version "${GITHUB_SHA::7}" --out .pio/build/supermini/sbom.cdx.json

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plane-radar-supermini
          if-no-files-found: error
          path: |
            .pio/build/supermini/firmware-merged.bin
            .pio/build/supermini/firmware.bin
            .pio/build/supermini/bootloader.bin
            .pio/build/supermini/partitions.bin
            .pio/build/supermini/sbom.cdx.json
