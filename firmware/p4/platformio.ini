; Plane Radar for ESP32-P4 4" round touch (port in progress)
; Starting point: a copy of the C3 Super Mini firmware (firmware/c3-supermini),
; built for a generic ESP32-P4. Target: Waveshare ESP32-P4-WIFI6-Touch-LCD-4C
; (4" round 720x720 MIPI-DSI touch, 32 MB PSRAM, 32 MB flash, Wi-Fi through
; an ESP32-C6). Its display, touch, Wi-Fi link and partition layout are not
; set up yet. See README.md.

[platformio]
default_envs = p4

[env:p4]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5 (the official
; espressif32 platform stops at core 2.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4
framework = arduino
monitor_speed = 115200
; Releases: tags "p4-v0.1.0" (this board's own; never marked "Latest", which
; belongs to the C3 Super Mini). The update check stays off until it can
; look for p4- tags rather than the latest release.
custom_tag_prefix = p4-
custom_update_check = no
board_build.partitions = partitions/plane_radar.csv
extra_scripts =
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py
  post:scripts/sign_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw
; Public half of the OTA signing key (NUL-terminated for the PEM parser).
; Over-the-air updates must be signed with the matching private key, which
; is never stored in this repository (see SECURITY.md).
board_build.embed_txtfiles = keys/ota-signing-public.pem

; USB serial over the board's native USB
; No -std flag here: core 3.x sets its own (gnu++2a), which would override it.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  ; No WiFiManager help table / GitHub link on Info (see the About page).
  -DWM_NOHELP
  ; Update library: refuse OTA images without a valid signature.
  -DUPDATE_SIGN
  ; The P4 has no Wi-Fi radio of its own (it talks to an ESP32-C6), so this
  ; setting does not exist. WiFiManager only uses it in country presets we
  ; never apply; 20 (dBm) lets it compile. Revisit with the real Wi-Fi link.
  -DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20

; Warnings for project sources only (not libraries). Format mismatches are
; errors: a printf/snprintf argument of the wrong type is undefined
; behaviour (e.g. printing a long with %f showed a garbage temperature).
build_src_flags =
  -Wall
  -Werror=format

; Static analysis: pio check -e p4 (cppcheck, project sources only).
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
  +<src/>
  +<include/>
check_severity = low, medium, high
check_flags =
  cppcheck: --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=*:*/.pio/*

; Exact versions: the firmware relies on library internals checked against
; these releases (WebServer handler order, HTTPClient keep-alive, WiFiManager
; route registration, LovyanGFX font ownership). Re-check before bumping.
; LovyanGFX >= 1.2.24 is required for loadFont(data, font_type).
lib_deps =
  lovyan03/LovyanGFX@1.2.36
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3


; Host-side unit tests (no hardware): pio test -e native
; Each test/test_*/ suite compiles the code it covers directly; test/stubs
; stands in for the few Arduino/ESP-IDF headers that code needs.
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -Iinclude
  -Itest/stubs
  -Wall
lib_deps =
  bblanchon/ArduinoJson@7.4.3
lib_compat_mode = off
